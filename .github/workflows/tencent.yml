# GitHub configuration (repository or production environment):
# Variables:
#   TKE_IMAGE_URL: full image repository, without protocol or tag,
#     e.g. ccr.ccs.tencentyun.com/<namespace>/orbit-user-management
# Secrets (names retained from the original Tencent template):
#   TENCENT_CLOUD_ACCOUNT_ID: registry login username shown by Tencent Cloud
#   TKE_REGISTRY_PASSWORD: registry login password/token with push permission
# The target namespace/repository must already exist and allow runner access.

name: Tencent Container Registry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publishing so two runs do not update the latest tag concurrently.
concurrency:
  group: tencent-registry-main
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-test-publish:
    name: Build, Test, and Publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate registry configuration
        id: registry
        env:
          IMAGE_NAME: ${{ vars.TKE_IMAGE_URL }}
          REGISTRY_USERNAME: ${{ secrets.TENCENT_CLOUD_ACCOUNT_ID }}
          REGISTRY_PASSWORD: ${{ secrets.TKE_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          invalid=0
          if [[ -z "$IMAGE_NAME" ]]; then
            echo "::error::Set the TKE_IMAGE_URL Actions variable to your Tencent image repository."
            invalid=1
          elif [[ ! "$IMAGE_NAME" =~ ^[a-z0-9.-]+(:[0-9]+)?/[a-z0-9._-]+(/[a-z0-9._-]+)+$ ]]; then
            echo "::error::TKE_IMAGE_URL must be registry/namespace/image, without https:// or an image tag."
            invalid=1
          fi
          if [[ -z "$REGISTRY_USERNAME" ]]; then
            echo "::error::Set the TENCENT_CLOUD_ACCOUNT_ID Actions secret to the registry login username."
            invalid=1
          fi
          if [[ -z "$REGISTRY_PASSWORD" ]]; then
            echo "::error::Set the TKE_REGISTRY_PASSWORD Actions secret to the registry password/token."
            invalid=1
          fi
          if (( invalid )); then
            exit 1
          fi
          printf 'host=%s\n' "${IMAGE_NAME%%/*}" >> "$GITHUB_OUTPUT"
          printf 'IMAGE_NAME=%s\n' "$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build application image
        run: make build

      - name: Start application and PostgreSQL
        run: docker compose up -d --no-build --wait --wait-timeout 120

      - name: Run API integration tests
        run: make test

      - name: Show container logs on failure
        if: failure() && steps.checkout.outcome == 'success'
        run: docker compose logs --no-color --tail=100

      - name: Stop test containers
        if: always() && steps.checkout.outcome == 'success'
        run: docker compose down --volumes --remove-orphans

      - name: Login to Tencent registry
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ secrets.TENCENT_CLOUD_ACCOUNT_ID }}
          password: ${{ secrets.TKE_REGISTRY_PASSWORD }}

      - name: Publish image
        run: |
          set -euo pipefail
          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker tag "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:latest"
          {
            printf '### Tencent image published\n\n'
            printf -- '- Commit image: `%s:%s`\n' "$IMAGE_NAME" "$IMAGE_TAG"
            printf -- '- Latest image: `%s:latest`\n' "$IMAGE_NAME"
            printf -- '- Platform: `linux/amd64`\n'
          } >> "$GITHUB_STEP_SUMMARY"
